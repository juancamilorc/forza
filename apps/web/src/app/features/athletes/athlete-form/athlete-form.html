<div class="athlete-form">

  <!-- Header -->
  <div class="page-header">
    <button class="btn-back" (click)="goBack()">
      <span class="material-symbols-outlined">arrow_back</span>
      Deportistas
    </button>
    <h1 class="page-title">
      {{ isEdit() ? 'Editar deportista' : 'Nuevo deportista' }}
    </h1>
  </div>

  @if (loading()) {
    <div class="loading">
      <span class="material-symbols-outlined spinning">progress_activity</span>
      <p>Cargando...</p>
    </div>
  }

  @if (!loading()) {
    <div class="form-card">

      <!-- Error -->
      @if (error()) {
        <div class="error-banner">
          <span class="material-symbols-outlined">error</span>
          {{ error() }}
        </div>
      }

      <div class="form-grid">

        <!-- Nombre -->
        <div class="form-group">
          <label class="form-label" for="first_name">Nombre <span class="required">*</span></label>
          <input
            id="first_name"
            type="text"
            class="form-input"
            placeholder="Ej: Carlos"
            [value]="form().first_name"
            (input)="updateField('first_name', $any($event.target).value)"
          />
        </div>

        <!-- Apellido -->
        <div class="form-group">
          <label class="form-label" for="last_name">Apellido <span class="required">*</span></label>
          <input
            id="last_name"
            type="text"
            class="form-input"
            placeholder="Ej: Pérez"
            [value]="form().last_name"
            (input)="updateField('last_name', $any($event.target).value)"
          />
        </div>

        <!-- Fecha de nacimiento -->
        <div class="form-group">
          <label class="form-label" for="birth_date">Fecha de nacimiento <span class="required">*</span></label>
          <input
            id="birth_date"
            type="date"
            class="form-input"
            [value]="form().birth_date"
            (input)="updateField('birth_date', $any($event.target).value)"
          />
        </div>

        <!-- Género -->
        <div class="form-group">
          <label class="form-label" for="gender">Género <span class="required">*</span></label>
          <select
            id="gender"
            class="form-input"
            (change)="updateField('gender', $any($event.target).value)"
          >
            <option value="" [selected]="form().gender === ''">Seleccionar...</option>
            <option value="M" [selected]="form().gender === 'M'">Masculino</option>
            <option value="F" [selected]="form().gender === 'F'">Femenino</option>
          </select>
        </div>

        <!-- Estado -->
        <div class="form-group">
          <label class="form-label" for="status">Estado</label>
          <select
            id="status"
            class="form-input"
            (change)="updateField('status', $any($event.target).value)"
          >
            <option value="trial"    [selected]="form().status === 'trial'">Prueba</option>
            <option value="active"   [selected]="form().status === 'active'">Activo</option>
            <option value="inactive" [selected]="form().status === 'inactive'">Inactivo</option>
          </select>
        </div>

        <!-- Entrenador -->
        @if (isAdmin) {
          <div class="form-group">
            <label class="form-label" for="trainer_id">Entrenador <span class="required">*</span></label>
            <select
              id="trainer_id"
              class="form-input"
              (change)="updateField('trainer_id', $any($event.target).value)"
            >
              <option value="" [selected]="form().trainer_id === ''">Seleccionar entrenador...</option>
              @for (t of trainersList(); track t.id) {
                <option [value]="t.id" [selected]="form().trainer_id === t.id">
                  {{ t.users.full_name }}
                </option>
              }
            </select>
          </div>
        }

        <!-- Notas -->
        <div class="form-group full-width">
          <label class="form-label" for="notes">Notas</label>
          <textarea
            id="notes"
            class="form-input textarea"
            placeholder="Observaciones adicionales..."
            [value]="form().notes"
            (input)="updateField('notes', $any($event.target).value)"
          ></textarea>
        </div>

      </div>

      <!-- Botones -->
      <div class="form-actions">
        <button class="btn-secondary" (click)="goBack()">
          Cancelar
        </button>
        <button
          class="btn-primary"
          (click)="onSubmit()"
          [disabled]="saving()"
        >
          @if (saving()) {
            <span class="material-symbols-outlined spinning">progress_activity</span>
            Guardando...
          } @else {
            <span class="material-symbols-outlined">save</span>
            {{ isEdit() ? 'Guardar cambios' : 'Crear deportista' }}
          }
        </button>
      </div>

    </div>
  }

</div>
